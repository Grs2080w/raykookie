name: _diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test apksigner 37.0.0 against a real signed apk
        run: |
          f="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          echo "apksigner: $f"
          "$f" --version
          echo "=== stdout (redirected 2>/dev/null) ==="
          "$f" verify --print-certs .diag-test.apk 2>/dev/null
          echo "=== exit code: $? ==="
          echo "=== combined 2>&1 ==="
          "$f" verify --print-certs .diag-test.apk 2>&1 || echo "falhou com $?"
