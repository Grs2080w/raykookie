server:
  port: ${PORT:10005}
  tomcat:
    # Corpo recusado (413) é descartado até 1 MB; acima disso a conexão é fechada (G08).
    max-swallow-size: 1MB

spring:
  # Banco: pool Hikari, Flyway nos dois modos (banco novo / perfil prod com baseline 21). URL em rayka.db.url.
  config:
    import: classpath:persistence.yml
  threads:
    virtual:
      enabled: true
  # Formulários com fotos (devolução, feedback): 2 MB por foto e 12 MB no total, os limites do Node (G08).
  # Os limites por rota de corpos que não são multipart ficam em rayka.web (WebProperties).
  servlet:
    multipart:
      max-file-size: 2000000B
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

rayka:
  # Única conta que entra no painel (G24); o servidor não sobe se ela não existir em users.
  shop-owner: ${SHOP_OWNER:}
  web:
    # Proxies cujo X-Forwarded-For é aceito (G05). Ver docs/ip-do-cliente.md.
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
